server.port=${PORT:8080}

spring.datasource.url=${SUPABASE_DB_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/biblioteca}}
spring.datasource.username=${DATABASE_USERNAME:biblioteca}
spring.datasource.password=${DATABASE_PASSWORD:biblioteca123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
